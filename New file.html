.ballon img{
    width:160px;
    height:auto;
    transform:translate(10px,-140px)  rotate(315deg);
    position:absolute;
    overflow:hidden;
   animation:none;
}
       
       @keyframes moveballon {
           from {transform: translate(0,-140px) rotate(325deg);}
           to 
           {transform: translate(-120px,-250px) rotate(325deg);
           }
       }
       
       .ballon2 img {
           width:160px;
    height:auto;
    transform:translate(-500px,300px)  rotate(45deg);
    position:absolute;
    overflow:hidden;
   animation:none;
       }
       
       @keyframes moveballon2{
           from{
               transform:translate(-500px,200px)
               rotate(30deg);
           }
           to {transform:translate(-350px,70px) rotate(30deg);
               
           }
       }
       
       .cake img{
           width:320px;
           height:auto;
           position: absolute;
           transform: translate(-300px,300px);
           animation:none;
       }
       @keyframes movecake{
           from{
               transform:translate(-300px,200px);
           }
           to{
               transform:translate(-300px,80px);
           }
       }
       
.container.start .ballon img{
